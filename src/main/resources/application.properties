quarkus.application.name=user-service

# Datasource configuration - default dev profile
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:userdb;DB_CLOSE_DELAY=-1
quarkus.datasource.username=sa
quarkus.datasource.password=

# Hibernate ORM & Flyway
quarkus.hibernate-orm.database.generation=none
quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true

# Docker profile override
%docker.quarkus.datasource.jdbc.url=jdbc:h2:tcp://h2-db:9092/mem:userdb;DB_CLOSE_DELAY=-1

# Logging
quarkus.log.level=INFO
quarkus.log.category."com.example.userservice".level=DEBUG
