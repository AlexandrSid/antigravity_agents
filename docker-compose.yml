services:
  h2-db:
    build:
      context: ./docker/h2
    ports:
      - "9092:9092"
    volumes:
      - h2-data:/data
    healthcheck:
      test: ["CMD-SHELL", "java -cp /opt/h2.jar org.h2.tools.Shell -url jdbc:h2:tcp://localhost:9092/./userservice -user sa -sql 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 12

  user-service:
    build:
      context: .
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      h2-db:
        condition: service_healthy

volumes:
  h2-data:
